name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Warn when the Turnstile sitekey variable is missing
        if: ${{ vars.VITE_TURNSTILE_SITEKEY == '' }}
        run: echo "::warning::Repository variable VITE_TURNSTILE_SITEKEY is not set; JD Matcher requests will fail the bot check."
      - run: npm run build
        env:
          # The only two variables the bundle may contain; both are public.
          # Repository variable VITE_TURNSTILE_SITEKEY = 0x4AAAAAAFXyLr0V56ZxZ0cj (Managed widget for cuongle.technet.software).
          VITE_API_BASE: https://jd-api.cuongle.technet.software
          VITE_TURNSTILE_SITEKEY: ${{ vars.VITE_TURNSTILE_SITEKEY }}
      - name: Check bundle for secrets and internal hosts
        run: npm run check:dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

    <!-- Theme before first paint: the saved choice, else the system's (see src/hooks/useTheme.ts). -->
    <script>
      (function () {
        var mode = 'light';
        try {
          var pref = localStorage.getItem('theme');
          mode = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        } catch (e) {}
        document.documentElement.dataset.theme = mode;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', mode === 'dark' ? '#1F1E1D' : '#FAF9F5');
      })();
    </script>
